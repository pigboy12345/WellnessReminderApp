[Excel]
FilePath = data/WellnessReminders.xlsx

[Database]
Driver = ODBC Driver 17 for SQL Server
Server = PDC00ERPDS301W
; Your original connection string did not specify a database (Initial Catalog).
; Fill this in with the correct database name, or leave blank to use the
; login's default database.
Database = 
; UID and PWD loaded from .env file for security
; UID = 
; PWD =
Encrypt = no
TrustServerCertificate = yes
Application Name = WellnessReminderApp
; 0 = no command timeout, same as your original connection string
CommandTimeout = 0

[Notification]
LogoPath = assets/logo.png
SnoozeMinutes = 10
MaxSnoozes = 3
; Show a custom popup window (with GIF/video playback) when a reminder's
; icon/image column contains a GIF or video path (local or URL).
MediaPopupEnabled = True
; Max width (px) of the media popup window.
MediaMaxWidth = 420
; 0 = popup stays until the user closes it; otherwise close after N seconds.
MediaTimeoutSeconds = 0
; 0 = loop GIFs forever; otherwise stop after N loops.
GifMaxLoops = 0

[Logging]
LogFile = logs/wellness_reminder.log
LogLevel = INFO
